<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NUVY PHOTO - Live Snapshot Cam</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      padding-bottom: env(safe-area-inset-bottom);
    }

    h1 { font-size: 16px; margin-bottom: 12px; color: #aaa; letter-spacing: 2px; }

    /* 폴라로이드 카드 스타일 */
    .polaroid-card {
      background: #faf9f6;
      padding: 12px 12px 55px 12px;
      border-radius: 3px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 350px;
      position: relative;
    }

    /* 뷰파인더 (정사각형 영역) */
    .viewfinder {
      position: relative;
      width: 100%;
      padding-top: 100%; 
      background-color: #000;
      overflow: hidden;
      border-radius: 2px;
    }

    /* 카메라 비디오 스트림 */
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; 
    }

    /* 실시간 라이브 필터 (마음에 드셨던 기준 수치) */
    video.filtered {
      filter: contrast(140%) saturate(50%) brightness(105%) sepia(10%);
      transform-origin: center center;
    }

    /* 직광 플래시 오버레이 */
    .flash-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background: radial-gradient(
        circle at 50% 45%, 
        rgba(255, 255, 255, 0.45) 0%, 
        rgba(255, 255, 255, 0.1) 55%, 
        rgba(0, 0, 0, 0.15) 100%
      );
      mix-blend-mode: screen;
      opacity: 0.35;
      z-index: 2;
    }

    /* 3-2-1 카운트다운 타이머 오버레이 */
    .timer-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.2);
      z-index: 10;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
      user-select: none;
    }

    /* 폴라로이드 하단 브랜드 문구 - 얇고 고급스럽게 */
    .polaroid-caption {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #2a2a2a;
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 5px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      opacity: 0.75;
    }

    /* 컨트롤 버튼 */
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-shoot {
      background: #ff4757;
      color: white;
      box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
    }
    .btn-shoot:active { transform: scale(0.96); }
    .btn-shoot:disabled { background: #888; box-shadow: none; cursor: not-allowed; }

    .btn-switch {
      background: #333;
      color: #ddd;
    }

    /* 결과 모달 */
    .result-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .result-modal img {
      max-width: 90%;
      max-height: 70vh;
      border-radius: 2px;
      margin-bottom: 20px;
    }
    .result-modal .btn-group {
      display: flex;
      gap: 10px;
    }

    canvas#saveCanvas { display: none; }

    /* 📸 촬영 직전 화면 전체가 하얗게 번쩍이는 가짜 플래시 */
    #screenFlash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <h1>NUVY PHOTO</h1>

  <!-- 폴라로이드 프리뷰 -->
  <div class="polaroid-card">
    <div class="viewfinder" id="viewfinder">
      <video id="webcam" autoplay playsinline muted class="filtered"></video>
      <div id="flashOverlay" class="flash-overlay"></div>
      <!-- 타이머 표시 레이어 -->
      <div id="timerOverlay" class="timer-overlay">3</div>
    </div>
    <!-- 브랜드 문구 (NUVY PHOTO) -->
    <div class="polaroid-caption">NUVY PHOTO</div>
  </div>

  <div class="controls">
    <button class="btn btn-switch" id="btnSwitch">카메라 전환</button>
    <button class="btn btn-shoot" id="btnShoot">📸 촬영 (3초)</button>
  </div>

  <canvas id="saveCanvas"></canvas>
  <div id="screenFlash"></div>

  <!-- 저장 모달 -->
  <div class="result-modal" id="resultModal">
    <img id="resultImage" alt="Polaroid Result">
    <div class="btn-group">
      <a id="downloadLink" class="btn btn-shoot" download="nuvy-polaroid.png">저장</a>
      <button class="btn btn-switch" id="btnClose">다시 찍기</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const btnShoot = document.getElementById('btnShoot');
    const btnSwitch = document.getElementById('btnSwitch');
    const timerOverlay = document.getElementById('timerOverlay');
    const canvas = document.getElementById('saveCanvas');
    const resultModal = document.getElementById('resultModal');
    const resultImage = document.getElementById('resultImage');
    const downloadLink = document.getElementById('downloadLink');
    const btnClose = document.getElementById('btnClose');
    const screenFlash = document.getElementById('screenFlash');

    let currentFacingMode = 'user';
    let stream = null;
    let videoWidth = 0;
    let videoHeight = 0;

    const ZOOM_FACTOR = 1.25;

    async function startCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1440 },
            height: { ideal: 1440 }
          },
          audio: false
        };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;

        video.onloadedmetadata = () => {
          videoWidth = video.videoWidth;
          videoHeight = video.videoHeight;
          video.play();
        };

        const flip = (currentFacingMode === 'user') ? -1 : 1;
        video.style.transform = `scaleX(${flip}) scale(${ZOOM_FACTOR})`;

      } catch (err) {
        alert("카메라 권한을 확인할 수 없습니다. HTTPS 환경인지 확인해 주세요.");
      }
    }

    btnSwitch.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera();
    });

    // ⏱️ 3-2-1 타이머 후 촬영 시작
    btnShoot.addEventListener('click', () => {
      btnShoot.disabled = true;
      btnSwitch.disabled = true;
      timerOverlay.style.display = 'flex';

      let count = 3;
      timerOverlay.textContent = count;

      const countdown = setInterval(() => {
        count--;
        if (count > 0) {
          timerOverlay.textContent = count;
        } else {
          clearInterval(countdown);
          timerOverlay.style.display = 'none';
          triggerFlashAndCapture(); // 화면 번쩍 + 그 순간 촬영
          btnShoot.disabled = false;
          btnSwitch.disabled = false;
        }
      }, 1000);
    });

    // 💡 화면을 하얗게 확 밝힌 뒤(진짜 조명 역할도 살짝 함), 가장 밝은 순간 촬영하고 다시 사라짐
    function triggerFlashAndCapture() {
      screenFlash.style.transition = 'opacity 60ms ease-out';
      screenFlash.style.opacity = '1';

      setTimeout(() => {
        takeSnapshot();
        screenFlash.style.transition = 'opacity 350ms ease-in';
        screenFlash.style.opacity = '0';
      }, 120); // 화면이 하얗게 유지되는 짧은 시간 (이 순간 사진이 찍힘)
    }

    // 🎯 CSS filter: contrast(140%) saturate(50%) brightness(105%) sepia(10%) 를
    // canvas의 ctx.filter에 의존하지 않고, 픽셀 단위로 직접 수식 계산해서 적용합니다.
    // (모바일 Safari 등에서 ctx.filter가 CSS filter만큼 정확하게 지원되지 않아
    //  라이브뷰와 저장본이 달라지는 문제의 원인이었습니다)
    function applyLiveFilterMath(imageData) {
      const d = imageData.data;

      const CONTRAST = 1.4;
      const contrastOffset = 127.5 * (1 - CONTRAST);

      for (let i = 0; i < d.length; i += 4) {
        let r = d[i], g = d[i + 1], b = d[i + 2];

        // 1. contrast(140%)
        r = r * CONTRAST + contrastOffset;
        g = g * CONTRAST + contrastOffset;
        b = b * CONTRAST + contrastOffset;

        // 2. saturate(50%) - CSS 표준 채도 행렬
        let sr = 0.6065 * r + 0.3575 * g + 0.036 * b;
        let sg = 0.1065 * r + 0.8575 * g + 0.036 * b;
        let sb = 0.1065 * r + 0.3575 * g + 0.536 * b;
        r = sr; g = sg; b = sb;

        // 3. brightness(105%)
        r *= 1.05; g *= 1.05; b *= 1.05;

        // 4. sepia(10%) - identity와 세피아 행렬 10% 보간
        let pr = 0.9393 * r + 0.0769 * g + 0.0189 * b;
        let pg = 0.0349 * r + 0.9686 * g + 0.0168 * b;
        let pb = 0.0272 * r + 0.0534 * g + 0.9131 * b;

        d[i]     = pr < 0 ? 0 : pr > 255 ? 255 : pr;
        d[i + 1] = pg < 0 ? 0 : pg > 255 ? 255 : pg;
        d[i + 2] = pb < 0 ? 0 : pb > 255 ? 255 : pb;
      }

      return imageData;
    }

    // 📸 라이브 화면(비디오+CSS필터) 느낌을 그대로 재현하는 스냅샷 함수
    function takeSnapshot() {
      const ctx = canvas.getContext('2d');

      const photoSize = 1000;
      const borderWidth = 40;
      const bottomBorderWidth = 160;
      const canvasWidth = photoSize + (borderWidth * 2);
      const canvasHeight = photoSize + borderWidth + bottomBorderWidth;

      canvas.width = canvasWidth;
      canvas.height = canvasHeight;

      // 1. 폴라로이드 아이보리 바탕
      ctx.fillStyle = '#faf9f6';
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      // 2. 사진 영역 - 필터 없이 원본 프레임을 먼저 그림 (ctx.filter 사용 안 함)
      ctx.save();
      ctx.beginPath();
      ctx.rect(borderWidth, borderWidth, photoSize, photoSize);
      ctx.clip();

      const baseSize = Math.min(videoWidth, videoHeight);
      const cropSize = baseSize / ZOOM_FACTOR;
      const sourceX = (videoWidth - cropSize) / 2;
      const sourceY = (videoHeight - cropSize) / 2;

      if (currentFacingMode === 'user') {
        ctx.translate(borderWidth + photoSize, borderWidth);
        ctx.scale(-1, 1);
        ctx.drawImage(video, sourceX, sourceY, cropSize, cropSize, 0, 0, photoSize, photoSize);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      } else {
        ctx.drawImage(video, sourceX, sourceY, cropSize, cropSize, borderWidth, borderWidth, photoSize, photoSize);
      }

      // 3. 방금 그린 사진 영역의 픽셀을 읽어서 직접 필터 수식 적용 (라이브뷰와 동일한 결과)
      const photoImageData = ctx.getImageData(borderWidth, borderWidth, photoSize, photoSize);
      applyLiveFilterMath(photoImageData);
      ctx.putImageData(photoImageData, borderWidth, borderWidth);

      // 4. 라이브 화면의 flash-overlay(중앙 하이라이트 방사형 그라데이션) 동일 반영
      const gradCenterX = borderWidth + photoSize * 0.5;
      const gradCenterY = borderWidth + photoSize * 0.45;
      const gradRadius = photoSize * 0.71;
      const flashGrad = ctx.createRadialGradient(
        gradCenterX, gradCenterY, 0,
        gradCenterX, gradCenterY, gradRadius
      );
      flashGrad.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
      flashGrad.addColorStop(0.55, 'rgba(255, 255, 255, 0.1)');
      flashGrad.addColorStop(1, 'rgba(0, 0, 0, 0.15)');

      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = flashGrad;
      ctx.fillRect(borderWidth, borderWidth, photoSize, photoSize);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;

      ctx.restore();

      // 5. 하단 중앙 브랜드 각인 (NUVY PHOTO) - 얇고 고급스러운 서체
      ctx.fillStyle = '#2a2a2a';
      ctx.font = '300 30px "Helvetica Neue", Helvetica, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if ('letterSpacing' in ctx) {
        ctx.letterSpacing = '8px';
      }
      const textY = borderWidth + photoSize + (bottomBorderWidth / 2) - 5;
      ctx.fillText('NUVY PHOTO', canvasWidth / 2 + ('letterSpacing' in ctx ? 20 : 0), textY);

      // 6. 모달 표시 - PNG로 저장해서 JPEG 압축으로 인한 채도 손실을 방지
      const dataUrl = canvas.toDataURL('image/png');
      resultImage.src = dataUrl;
      downloadLink.href = dataUrl;
      downloadLink.download = 'nuvy-polaroid.png';
      resultModal.style.display = 'flex';
    }

    btnClose.addEventListener('click', () => {
      resultModal.style.display = 'none';
    });

    startCamera();
  </script>
</body>
</html>
