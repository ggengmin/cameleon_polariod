<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NUVY PHOTO - Live Snapshot Cam</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      padding-bottom: env(safe-area-inset-bottom);
    }

    h1 { font-size: 16px; margin-bottom: 12px; color: #aaa; letter-spacing: 2px; }

    /* 폴라로이드 카드 스타일 */
    .polaroid-card {
      background: #faf9f6;
      padding: 12px 12px 55px 12px;
      border-radius: 3px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 350px;
      position: relative;
    }

    /* 뷰파인더 (정사각형 영역) */
    .viewfinder {
      position: relative;
      width: 100%;
      padding-top: 100%; 
      background-color: #000;
      overflow: hidden;
      border-radius: 2px;
    }

    /* 원본 비디오는 화면에 보이지 않고, 프레임 소스로만 사용 */
    video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* 실시간 화면에 실제로 보이는 캔버스 (저장 시 이 함수를 그대로 재사용) */
    #livePreviewCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }

    /* 3-2-1 카운트다운 타이머 오버레이 */
    .timer-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.2);
      z-index: 10;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
      user-select: none;
    }

    /* 폴라로이드 하단 브랜드 문구 - 더 얇고 고급스럽게 */
    .polaroid-caption {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #2a2a2a;
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 5px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      opacity: 0.75;
    }

    /* 컨트롤 버튼 */
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-shoot {
      background: #ff4757;
      color: white;
      box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
    }
    .btn-shoot:active { transform: scale(0.96); }
    .btn-shoot:disabled { background: #888; box-shadow: none; cursor: not-allowed; }

    .btn-switch {
      background: #333;
      color: #ddd;
    }

    /* 결과 모달 */
    .result-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .result-modal img {
      max-width: 90%;
      max-height: 70vh;
      border-radius: 2px;
      margin-bottom: 20px;
    }
    .result-modal .btn-group {
      display: flex;
      gap: 10px;
    }

    canvas#saveCanvas { display: none; }
  </style>
</head>
<body>

  <h1>NUVY PHOTO</h1>

  <!-- 폴라로이드 프리뷰 -->
  <div class="polaroid-card">
    <div class="viewfinder" id="viewfinder">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="livePreviewCanvas"></canvas>
      <!-- 타이머 표시 레이어 -->
      <div id="timerOverlay" class="timer-overlay">3</div>
    </div>
    <!-- 브랜드 문구 (NUVY PHOTO) -->
    <div class="polaroid-caption">NUVY PHOTO</div>
  </div>

  <div class="controls">
    <button class="btn btn-switch" id="btnSwitch">카메라 전환</button>
    <button class="btn btn-shoot" id="btnShoot">📸 촬영 (3초)</button>
  </div>

  <canvas id="saveCanvas"></canvas>

  <!-- 저장 모달 -->
  <div class="result-modal" id="resultModal">
    <img id="resultImage" alt="Polaroid Result">
    <div class="btn-group">
      <a id="downloadLink" class="btn btn-shoot" download="nuvy-polaroid.jpg">저장</a>
      <button class="btn btn-switch" id="btnClose">다시 찍기</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const liveCanvas = document.getElementById('livePreviewCanvas');
    const liveCtx = liveCanvas.getContext('2d');
    const viewfinder = document.getElementById('viewfinder');
    const btnShoot = document.getElementById('btnShoot');
    const btnSwitch = document.getElementById('btnSwitch');
    const timerOverlay = document.getElementById('timerOverlay');
    const canvas = document.getElementById('saveCanvas');
    const resultModal = document.getElementById('resultModal');
    const resultImage = document.getElementById('resultImage');
    const downloadLink = document.getElementById('downloadLink');
    const btnClose = document.getElementById('btnClose');

    let currentFacingMode = 'user';
    let stream = null;
    let videoWidth = 0;
    let videoHeight = 0;
    let rafId = null;

    const ZOOM_FACTOR = 1.25;
    const FILTER_STRING = 'contrast(125%) saturate(65%) brightness(105%) sepia(5%)';

    // 🎯 핵심: 라이브 화면과 저장 사진이 절대 달라지지 않도록,
    // "화면에 보여줄 정사각형 프레임을 그리는 로직"을 이 함수 하나로 통일합니다.
    // 라이브 미리보기도, 최종 저장도 전부 이 함수를 그대로 호출합니다.
    function renderFrame(ctx, size, offsetX = 0, offsetY = 0) {
      if (!videoWidth || !videoHeight) return;

      ctx.save();
      ctx.translate(offsetX, offsetY);

      // 1) 필터가 적용된 카메라 프레임
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, size, size);
      ctx.clip();
      ctx.filter = FILTER_STRING;

      const baseSize = Math.min(videoWidth, videoHeight);
      const cropSize = baseSize / ZOOM_FACTOR;
      const sourceX = (videoWidth - cropSize) / 2;
      const sourceY = (videoHeight - cropSize) / 2;

      if (currentFacingMode === 'user') {
        ctx.translate(size, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, sourceX, sourceY, cropSize, cropSize, 0, 0, size, size);
      } else {
        ctx.drawImage(video, sourceX, sourceY, cropSize, cropSize, 0, 0, size, size);
      }
      ctx.restore();

      // 2) 플래시(중앙 하이라이트) 오버레이 - 필터 없이, 라이브/저장 동일 계산
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, size, size);
      ctx.clip();

      const gradCenterX = size * 0.5;
      const gradCenterY = size * 0.45;
      const gradRadius = size * 0.71;
      const flashGrad = ctx.createRadialGradient(
        gradCenterX, gradCenterY, 0,
        gradCenterX, gradCenterY, gradRadius
      );
      flashGrad.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
      flashGrad.addColorStop(0.55, 'rgba(255, 255, 255, 0.1)');
      flashGrad.addColorStop(1, 'rgba(0, 0, 0, 0.15)');

      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = flashGrad;
      ctx.fillRect(0, 0, size, size);
      ctx.restore();

      ctx.restore();
    }

    // 🔴 라이브 프리뷰 루프: 매 프레임 renderFrame()으로 화면을 그림
    function liveLoop() {
      const rect = viewfinder.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const targetSize = Math.round(rect.width * dpr);
      if (liveCanvas.width !== targetSize) {
        liveCanvas.width = targetSize;
        liveCanvas.height = targetSize;
      }
      liveCtx.clearRect(0, 0, liveCanvas.width, liveCanvas.height);
      renderFrame(liveCtx, liveCanvas.width);
      rafId = requestAnimationFrame(liveLoop);
    }

    async function startCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1440 },
            height: { ideal: 1440 }
          },
          audio: false
        };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;

        video.onloadedmetadata = () => {
          videoWidth = video.videoWidth;
          videoHeight = video.videoHeight;
          video.play();
          if (!rafId) liveLoop(); // 최초 1회만 루프 시작
        };

      } catch (err) {
        alert("카메라 권한을 확인할 수 없습니다. HTTPS 환경인지 확인해 주세요.");
      }
    }

    btnSwitch.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera();
    });

    // ⏱️ 3-2-1 타이머 후 촬영 시작
    btnShoot.addEventListener('click', () => {
      btnShoot.disabled = true;
      btnSwitch.disabled = true;
      timerOverlay.style.display = 'flex';

      let count = 3;
      timerOverlay.textContent = count;

      const countdown = setInterval(() => {
        count--;
        if (count > 0) {
          timerOverlay.textContent = count;
        } else {
          clearInterval(countdown);
          timerOverlay.style.display = 'none';
          takeSnapshot(); // 타이머 끝나면 바로 캡처!
          btnShoot.disabled = false;
          btnSwitch.disabled = false;
        }
      }, 1000);
    });

    // 📸 라이브 화면과 완전히 동일한 renderFrame()을 재사용하는 스냅샷 함수
    function takeSnapshot() {
      const ctx = canvas.getContext('2d');

      const photoSize = 1000;
      const borderWidth = 40;
      const bottomBorderWidth = 160;
      const canvasWidth = photoSize + (borderWidth * 2);
      const canvasHeight = photoSize + borderWidth + bottomBorderWidth;

      canvas.width = canvasWidth;
      canvas.height = canvasHeight;

      // 1. 폴라로이드 아이보리 바탕
      ctx.fillStyle = '#faf9f6';
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      // 2. 사진 영역 - 라이브 프리뷰와 동일한 renderFrame() 호출
      renderFrame(ctx, photoSize, borderWidth, borderWidth);

      // 3. 하단 중앙 브랜드 각인 (NUVY PHOTO) - 더 얇고 고급스러운 서체
      ctx.fillStyle = '#2a2a2a';
      ctx.font = '300 30px "Helvetica Neue", Helvetica, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if ('letterSpacing' in ctx) {
        ctx.letterSpacing = '8px'; // 최신 브라우저(Chrome 등)에서 자간 지원
      }
      const textY = borderWidth + photoSize + (bottomBorderWidth / 2) - 5;
      ctx.fillText('NUVY PHOTO', canvasWidth / 2 + ('letterSpacing' in ctx ? 20 : 0), textY);

      // 4. 모달 표시 - PNG로 저장해서 JPEG 압축으로 인한 채도 손실을 방지
      const dataUrl = canvas.toDataURL('image/png');
      resultImage.src = dataUrl;
      downloadLink.href = dataUrl;
      downloadLink.download = 'nuvy-polaroid.png';
      resultModal.style.display = 'flex';
    }

    btnClose.addEventListener('click', () => {
      resultModal.style.display = 'none';
    });

    startCamera();
  </script>
</body>
</html>
