<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>High-Contrast Polaroid Cam</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      padding-bottom: env(safe-area-inset-bottom);
    }

    h1 { font-size: 18px; margin-bottom: 12px; color: #eee; }

    /* 폴라로이드 실물 프레임 느낌 */
    .polaroid-card {
      background: #f6f5f2; /* 살짝 노란기 도는 아날로그 종이색 */
      padding: 14px 14px 50px 14px;
      border-radius: 3px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7);
      width: 100%;
      max-width: 350px;
      position: relative;
    }

    /* 뷰파인더 (정사각형) */
    .viewfinder {
      position: relative;
      width: 100%;
      padding-top: 100%; 
      background-color: #000;
      overflow: hidden;
      border-radius: 2px;
    }

    /* 카메라 비디오 스트림 */
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; 
    }

    /* --- [실시간 라이브 프리뷰 필터] --- */
    video.polaroid-style {
      /* 대비 165%, 채도 45%, 밝기 95%(암부 강조), 약간의 빛바랜 Sepia 10% */
      filter: contrast(165%) saturate(45%) brightness(95%) sepia(10%);
    }

    /* 가장자리 살짝 어두워지는 비넷(Vignette)만 남겨서 중앙 플래시 느낌 강조 */
    .vignette-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background: radial-gradient(
        circle at 50% 50%, 
        transparent 50%, 
        rgba(0, 0, 0, 0.35) 100%
      );
      z-index: 2;
    }

    /* 컨트롤 버튼 */
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-shoot {
      background: #e63946;
      color: white;
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.4);
    }
    .btn-shoot:active { transform: scale(0.96); }

    .btn-switch {
      background: #222;
      color: #ccc;
      border: 1px solid #444;
    }

    /* 결과 모달 */
    .result-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .result-modal img {
      max-width: 90%;
      max-height: 70vh;
      border-radius: 2px;
      margin-bottom: 20px;
    }
    .result-modal .btn-group {
      display: flex;
      gap: 10px;
    }

    canvas#saveCanvas { display: none; }
  </style>
</head>
<body>

  <h1>Polaroid Flash Cam</h1>

  <!-- 폴라로이드 프리뷰 -->
  <div class="polaroid-card">
    <div class="viewfinder">
      <video id="webcam" autoplay playsinline muted class="polaroid-style"></video>
      <div class="vignette-overlay"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-switch" id="btnSwitch">카메라 전환</button>
    <button class="btn btn-shoot" id="btnShoot">📸 촬영</button>
  </div>

  <canvas id="saveCanvas"></canvas>

  <div class="result-modal" id="resultModal">
    <img id="resultImage" alt="Polaroid Result">
    <div class="btn-group">
      <a id="downloadLink" class="btn btn-shoot" download="polaroid-raw.jpg">사진 저장</a>
      <button class="btn btn-switch" id="btnClose">다시 찍기</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const btnShoot = document.getElementById('btnShoot');
    const btnSwitch = document.getElementById('btnSwitch');
    const canvas = document.getElementById('saveCanvas');
    const resultModal = document.getElementById('resultModal');
    const resultImage = document.getElementById('resultImage');
    const downloadLink = document.getElementById('downloadLink');
    const btnClose = document.getElementById('btnClose');

    let currentFacingMode = 'user';
    let stream = null;
    let videoWidth = 0;
    let videoHeight = 0;

    // --- [강렬한 폴라로이드 수치 셋팅] ---
    const POLAROID_CONFIG = {
      contrast: 1.70,   // 명암 대비 170% (팍 올라감)
      saturate: 0.40,   // 채도 40% (확 낮춤)
      brightness: 0.95, // 전체 밝기 살짝 눌러서 명암차 돋보이게 함
      sepia: 0.10       // 아주 미세한 아날로그 톤 10%
    };

    async function startCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1440 },
            height: { ideal: 1440 }
          },
          audio: false
        };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;

        video.onloadedmetadata = () => {
          videoWidth = video.videoWidth;
          videoHeight = video.videoHeight;
          video.play();
        };

        video.style.transform = (currentFacingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';

      } catch (err) {
        alert("카메라 권한을 확인할 수 없습니다.");
      }
    }

    btnSwitch.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera();
    });

    // 📸 셔터 및 캔버스 합성
    btnShoot.addEventListener('click', () => {
      const ctx = canvas.getContext('2d');

      const photoSize = 1000;
      const borderWidth = 40;
      const bottomBorderWidth = 150;
      const canvasWidth = photoSize + (borderWidth * 2);
      const canvasHeight = photoSize + borderWidth + bottomBorderWidth;

      canvas.width = canvasWidth;
      canvas.height = canvasHeight;

      // 1. 프레임 바탕 (아날로그 아이보리)
      ctx.fillStyle = '#f6f5f2';
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      // 2. 사진 영역 클리핑
      ctx.save();
      ctx.beginPath();
      ctx.rect(borderWidth, borderWidth, photoSize, photoSize);
      ctx.clip();

      // 3. 강렬한 대비 + 빠진 채도 필터 적용
      ctx.filter = `contrast(${POLAROID_CONFIG.contrast * 100}%) saturate(${POLAROID_CONFIG.saturate * 100}%) brightness(${POLAROID_CONFIG.brightness * 100}%) sepia(${POLAROID_CONFIG.sepia * 100}%)`;

      // 4. Crop (중앙 자르기)
      let sourceX = 0, sourceY = 0, sourceSize = 0;
      if (videoWidth > videoHeight) {
        sourceSize = videoHeight;
        sourceX = (videoWidth - videoHeight) / 2;
      } else {
        sourceSize = videoWidth;
        sourceY = (videoHeight - videoWidth) / 2;
      }

      if (currentFacingMode === 'user') {
        ctx.translate(borderWidth + photoSize, borderWidth);
        ctx.scale(-1, 1);
        ctx.drawImage(video, sourceX, sourceY, sourceSize, sourceSize, 0, 0, photoSize, photoSize);
      } else {
        ctx.drawImage(video, sourceX, sourceY, sourceSize, sourceSize, borderWidth, borderWidth, photoSize, photoSize);
      }
      ctx.restore();

      // 5. 가장자리 어두워지는 비넷 효과만 캔버스에 아주 살짝 합성
      ctx.save();
      ctx.beginPath();
      ctx.rect(borderWidth, borderWidth, photoSize, photoSize);
      ctx.clip();

      const centerX = borderWidth + (photoSize / 2);
      const centerY = borderWidth + (photoSize / 2);
      const radius = photoSize * 0.75;

      const grad = ctx.createRadialGradient(centerX, centerY, photoSize * 0.3, centerX, centerY, radius);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.3)');

      ctx.fillStyle = grad;
      ctx.fillRect(borderWidth, borderWidth, photoSize, photoSize);
      ctx.restore();

      // 6. 저장 모달
      const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
      resultImage.src = dataUrl;
      downloadLink.href = dataUrl;
      resultModal.style.display = 'flex';
    });

    btnClose.addEventListener('click', () => {
      resultModal.style.display = 'none';
    });

    startCamera();
  </script>
</body>
</html>
