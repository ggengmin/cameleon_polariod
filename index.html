<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Flash Polaroid Cam (Fixed)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      padding-bottom: env(safe-area-inset-bottom);
    }

    h1 { font-size: 18px; margin-bottom: 10px; color: #eee; }

    /* 폴라로이드 카드 스타일 */
    .polaroid-card {
      background: #fdfdfc; /* 밝은 크림색 */
      padding: 12px 12px 45px 12px;
      border-radius: 4px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 350px;
      position: relative;
    }

    /* 뷰파인더 (정사각형 영역) */
    .viewfinder {
      position: relative;
      width: 100%;
      /* 정사각형 유지를 위한 hack */
      padding-top: 100%; 
      background-color: #000;
      overflow: hidden;
      border-radius: 2px;
    }

    /* 카메라 비디오 스트림 */
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      /* 비율 왜곡 없이 꽉 차게 (중앙 맞춤) */
      object-fit: cover; 
      /* 전면 카메라일 경우 좌우 반전은 JS에서 처리 */
    }

    /* --- [해결 1: 프리뷰 필터 적용 확인 및 조정] --- */
    /* 비디오에 직접 CSS 필터 적용 */
    video.filtered {
      /* 대비(Contrast)를 125%로 주었을 때 너무 뿌옇다면, brightness를 살짝 낮춰 밸런스를 맞춥니다. */
      filter: contrast(125%) saturate(65%) brightness(105%) sepia(5%);
    }

    /* 프리뷰용 플래시/블룸 오버레이 (뿌연 느낌 감소) */
    .flash-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background: radial-gradient(
        circle at 50% 40%, 
        rgba(255, 255, 255, 0.4) 0%, /* 중앙 밝기 감소 */
        rgba(255, 255, 255, 0.05) 60%, 
        transparent 95%
      );
      mix-blend-mode: screen;
      /* 뽀얀 효과 30%를 불투명도로 조절 */
      opacity: 0.3; 
      z-index: 2;
    }

    /* 컨트롤 버튼 */
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-shoot {
      background: #ff4757;
      color: white;
      box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
    }
    .btn-shoot:active { transform: scale(0.96); }

    .btn-switch {
      background: #333;
      color: #ddd;
    }

    /* 결과 모달 (저장 팝업) */
    .result-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .result-modal img {
      max-width: 90%;
      max-height: 70vh;
      border-radius: 2px;
      margin-bottom: 20px;
    }
    .result-modal .btn-group {
      display: flex;
      gap: 10px;
    }

    /* 합성용 캔버스 (숨김) */
    canvas#saveCanvas { display: none; }
  </style>
</head>
<body>

  <h1>Flash Polaroid Cam</h1>

  <!-- 폴라로이드 프리뷰 -->
  <div class="polaroid-card">
    <div class="viewfinder">
      <!-- .filtered 클래스로 CSS 필터 적용 확인 -->
      <video id="webcam" autoplay playsinline muted class="filtered"></video>
      <div id="flashOverlay" class="flash-overlay"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-switch" id="btnSwitch">카메라 전환</button>
    <button class="btn btn-shoot" id="btnShoot">📸 촬영</button>
  </div>

  <!-- 합성 및 저장용 캔버스 -->
  <canvas id="saveCanvas"></canvas>

  <!-- 저장 모달 -->
  <div class="result-modal" id="resultModal">
    <img id="resultImage" alt="Polaroid Result">
    <div class="btn-group">
      <a id="downloadLink" class="btn btn-shoot" download="polaroid-pic.jpg">저장</a>
      <button class="btn btn-switch" id="btnClose">닫기</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const flashOverlay = document.getElementById('flashOverlay');
    const btnShoot = document.getElementById('btnShoot');
    const btnSwitch = document.getElementById('btnSwitch');
    const canvas = document.getElementById('saveCanvas');
    const resultModal = document.getElementById('resultModal');
    const resultImage = document.getElementById('resultImage');
    const downloadLink = document.getElementById('downloadLink');
    const btnClose = document.getElementById('btnClose');

    let currentFacingMode = 'user'; // 'user' (전면), 'environment' (후면)
    let stream = null;
    let videoWidth = 0;
    let videoHeight = 0;

    // --- [해결 1: 선명도 조정을 위한 필터값 미세조정] ---
    // 전체적으로 '뿌연' 느낌을 줄이기 위해 대비를 유지하되 블룸 효과를 낮춤
    const FILTER_CONFIG = {
      contrast: 1.25,      // 대비 125% (유지)
      saturate: 0.65,      // 채도 65% (유지)
      brightness: 1.05,    // 프리뷰 밝기 보정 (살짝 낮춤)
      saveBrightness: 1.15,// 저장시 플래시 밝기 (유지)
      bloomOpacity: 0.15   // 뽀얀 효과 (프리뷰) (30% -> 15%로 감소하여 뿌연 느낌 줄임)
    };

    // 프리뷰 블룸 오버레이 투명도 적용
    flashOverlay.style.opacity = FILTER_CONFIG.bloomOpacity;

    async function startCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      try {
        // 아이패드에서 정사각형에 가까운 높은 해상도 요청
        const constraints = {
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1440 },
            height: { ideal: 1440 },
            aspectRatio: 1 // 정사각형 권장
          },
          audio: false
        };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;

        // 비디오의 실제 원본 크기 가져오기 (왜곡 해결에 필요)
        video.onloadedmetadata = () => {
          videoWidth = video.videoWidth;
          videoHeight = video.videoHeight;
          video.play();
        };

        // 전면 카메라일 경우 프리뷰 좌우 반전
        video.style.transform = (currentFacingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';

      } catch (err) {
        console.error("Camera error:", err);
        alert("카메라를 켤 수 없습니다. HTTPS 환경인지 확인해주세요.");
      }
    }

    btnSwitch.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera();
    });

    // --- [해결 2: 가로/세로 촬영 왜곡 없는 중앙 자르기(Crop) 로직] ---
    btnShoot.addEventListener('click', () => {
      const ctx = canvas.getContext('2d');

      // 저장용 고화질 캔버스 크기 (정사각형 사진 영역 기준)
      const photoSize = 1000;
      const borderWidth = 40;
      const bottomBorderWidth = 150;
      const canvasWidth = photoSize + (borderWidth * 2);
      const canvasHeight = photoSize + borderWidth + bottomBorderWidth;

      canvas.width = canvasWidth;
      canvas.height = canvasHeight;

      // 1. 흰색 프레임 그리기
      ctx.fillStyle = '#fdfdfc';
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      // 2. 사진 영역 클리핑 (합성 영역 지정)
      ctx.save();
      ctx.beginPath();
      ctx.rect(borderWidth, borderWidth, photoSize, photoSize);
      ctx.clip();

      // 3. 캔버스 필터 적용 (명암대비 125%, 채도 65%)
      ctx.filter = `contrast(${FILTER_CONFIG.contrast * 100}%) saturate(${FILTER_CONFIG.saturate * 100}%) brightness(${FILTER_CONFIG.saveBrightness * 100}%) sepia(5%)`;

      // 4. 중앙 자르기(Crop) 및 렌더링 로직 (왜곡 해결 핵심)
      let sourceX, sourceY, sourceSize;
      
      if (videoWidth > videoHeight) {
        // 가로로 긴 영상 (Landscape)
        sourceSize = videoHeight; // 짧은 쪽 기준
        sourceX = (videoWidth - videoHeight) / 2; // 중앙 맞춤
        sourceY = 0;
      } else {
        // 세로로 긴 영상 (Portrait)
        sourceSize = videoWidth; // 짧은 쪽 기준
        sourceX = 0;
        sourceY = (videoHeight - videoWidth) / 2; // 중앙 맞춤
      }

      // 전면 카메라 좌우 반전 처리
      if (currentFacingMode === 'user') {
        ctx.translate(borderWidth + photoSize, borderWidth);
        ctx.scale(-1, 1);
        // 중앙 자르기(sx, sy, sw, sh) 후 캔버스 영역(dx, dy, dw, dh)에 그리기
        ctx.drawImage(video, sourceX, sourceY, sourceSize, sourceSize, 0, 0, photoSize, photoSize);
      } else {
        ctx.drawImage(video, sourceX, sourceY, sourceSize, sourceSize, borderWidth, borderWidth, photoSize, photoSize);
      }
      ctx.restore();

      // 5. 플래시 뽀얀 효과 합성 (선명도를 위해 불투명도 조절)
      ctx.save();
      ctx.beginPath();
      ctx.rect(borderWidth, borderWidth, photoSize, photoSize);
      ctx.clip();

      const centerX = borderWidth + (photoSize / 2);
      const centerY = borderWidth + (photoSize * 0.4);
      const radius = photoSize * 0.7;

      const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
      grad.addColorStop(0, `rgba(255, 255, 255, 0.5)`); // 중앙 밝기 감소
      grad.addColorStop(0.6, `rgba(255, 250, 240, 0.1)`);
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = grad;
      ctx.fillRect(borderWidth, borderWidth, photoSize, photoSize);
      ctx.restore();

      // 6. 완성이미지 모달 표시
      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      resultImage.src = dataUrl;
      downloadLink.href = dataUrl;
      resultModal.style.display = 'flex';
    });

    btnClose.addEventListener('click', () => {
      resultModal.style.display = 'none';
    });

    // 앱 시작
    startCamera();
  </script>
</body>
</html>
