<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NUBI PHOTO - Flash Polaroid Cam</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      padding-bottom: env(safe-area-inset-bottom);
    }

    h1 { font-size: 16px; margin-bottom: 12px; color: #aaa; letter-spacing: 2px; }

    /* 폴라로이드 카드 스타일 */
    .polaroid-card {
      background: #faf9f6; /* 빈티지 폴라로이드 인화지 색상 */
      padding: 12px 12px 55px 12px;
      border-radius: 3px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 350px;
      position: relative;
    }

    /* 뷰파인더 (정사각형 영역) */
    .viewfinder {
      position: relative;
      width: 100%;
      padding-top: 100%; 
      background-color: #000;
      overflow: hidden;
      border-radius: 2px;
    }

    /* 카메라 비디오 스트림 */
    video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; 
    }

    /* 1. 라이브 화면 필터 (전해주신 기존 기본 필터 기준) */
    video.filtered {
      filter: contrast(125%) saturate(65%) brightness(105%) sepia(5%);
      /* 3. 카메라 확대 (1.25배 디지털 줌) */
      transform-origin: center center;
    }

    /* 첨부 이미지 특유의 '정면 직광 플래시' 오버레이 레이어 */
    .flash-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      /* 중앙은 하얗게 밝고 테두리로 갈수록 자연스럽게 떨어지는 직광 플래시 */
      background: radial-gradient(
        circle at 50% 45%, 
        rgba(255, 255, 255, 0.45) 0%, 
        rgba(255, 255, 255, 0.1) 55%, 
        rgba(0, 0, 0, 0.15) 100%
      );
      mix-blend-mode: screen;
      opacity: 0.35;
      z-index: 2;
    }

    /* 폴라로이드 하단 텍스트 프리뷰 */
    .polaroid-caption {
      position: absolute;
      bottom: 18px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #222;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 3px;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      opacity: 0.8;
    }

    /* 컨트롤 버튼 */
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-shoot {
      background: #ff4757;
      color: white;
      box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
    }
    .btn-shoot:active { transform: scale(0.96); }

    .btn-switch {
      background: #333;
      color: #ddd;
    }

    /* 결과 모달 */
    .result-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .result-modal img {
      max-width: 90%;
      max-height: 70vh;
      border-radius: 2px;
      margin-bottom: 20px;
    }
    .result-modal .btn-group {
      display: flex;
      gap: 10px;
    }

    /* 합성용 캔버스 */
    canvas#saveCanvas { display: none; }
  </style>
</head>
<body>

  <h1>NUBI PHOTO</h1>

  <!-- 폴라로이드 프리뷰 -->
  <div class="polaroid-card">
    <div class="viewfinder">
      <video id="webcam" autoplay playsinline muted class="filtered"></video>
      <div id="flashOverlay" class="flash-overlay"></div>
    </div>
    <!-- 2. 폴라로이드 하단 브랜드 문구 -->
    <div class="polaroid-caption">NUBI PHOTO</div>
  </div>

  <div class="controls">
    <button class="btn btn-switch" id="btnSwitch">카메라 전환</button>
    <button class="btn btn-shoot" id="btnShoot">📸 촬영</button>
  </div>

  <canvas id="saveCanvas"></canvas>

  <!-- 저장 모달 -->
  <div class="result-modal" id="resultModal">
    <img id="resultImage" alt="Polaroid Result">
    <div class="btn-group">
      <a id="downloadLink" class="btn btn-shoot" download="nubi-polaroid.jpg">저장</a>
      <button class="btn btn-switch" id="btnClose">다시 찍기</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const btnShoot = document.getElementById('btnShoot');
    const btnSwitch = document.getElementById('btnSwitch');
    const canvas = document.getElementById('saveCanvas');
    const resultModal = document.getElementById('resultModal');
    const resultImage = document.getElementById('resultImage');
    const downloadLink = document.getElementById('downloadLink');
    const btnClose = document.getElementById('btnClose');

    let currentFacingMode = 'user';
    let stream = null;
    let videoWidth = 0;
    let videoHeight = 0;

    // 3. 확대 비율 설정 (1.25 = 25% 확대)
    const ZOOM_FACTOR = 1.25;

    async function startCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1440 },
            height: { ideal: 1440 }
          },
          audio: false
        };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;

        video.onloadedmetadata = () => {
          videoWidth = video.videoWidth;
          videoHeight = video.videoHeight;
          video.play();
        };

        // 전면 카메라 시 반전 + 확대(scale) 함께 적용
        const flip = (currentFacingMode === 'user') ? -1 : 1;
        video.style.transform = `scaleX(${flip}) scale(${ZOOM_FACTOR})`;

      } catch (err) {
        alert("카메라를 작동할 수 없습니다. HTTPS 환경인지 확인해 주세요.");
      }
    }

    btnSwitch.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startCamera();
    });

    // 📸 셔터 클릭시: 라이브 화면 100% 동일하게 캡처 + NUBI PHOTO 하단 프린팅
    btnShoot.addEventListener('click', () => {
      const ctx = canvas.getContext('2d');

      const photoSize = 1000;
      const borderWidth = 40;
      const bottomBorderWidth = 160; // 문구가 들어갈 하단 여백 확장
      const canvasWidth = photoSize + (borderWidth * 2);
      const canvasHeight = photoSize + borderWidth + bottomBorderWidth;

      canvas.width = canvasWidth;
      canvas.height = canvasHeight;

      // 1. 프레임 바탕 (아이보리)
      ctx.fillStyle = '#faf9f6';
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      // 2. 사진 영역 클리핑
      ctx.save();
      ctx.beginPath();
      ctx.rect(borderWidth, borderWidth, photoSize, photoSize);
      ctx.clip();

      // [핵심 1] 라이브 화면과 100% 동일하게 그리기 위해 라이브 비디오 CSS 필터를 캔버스에 직접 복사
      ctx.filter = 'contrast(125%) saturate(65%) brightness(105%) sepia(5%)';

      // [핵심 3] 확대(ZOOM_FACTOR)가 적용된 중앙 자르기 범위 계산
      let baseSize = Math.min(videoWidth, videoHeight);
      let cropSize = baseSize / ZOOM_FACTOR; // 확대된 만큼 원본에서 잘라내는 크기 축소
      let sourceX = (videoWidth - cropSize) / 2;
      let sourceY = (videoHeight - cropSize) / 2;

      if (currentFacingMode === 'user') {
        ctx.translate(borderWidth + photoSize, borderWidth);
        ctx.scale(-1, 1);
        ctx.drawImage(video, sourceX, sourceY, cropSize, cropSize, 0, 0, photoSize, photoSize);
      } else {
        ctx.drawImage(video, sourceX, sourceY, cropSize, cropSize, borderWidth, borderWidth, photoSize, photoSize);
      }
      ctx.restore();

      // [핵심 4] 라이브 화면의 직광 플래시 오버레이 레이어도 그대로 캔버스에 동일 합성
      ctx.save();
      ctx.beginPath();
      ctx.rect(borderWidth, borderWidth, photoSize, photoSize);
      ctx.clip();

      const centerX = borderWidth + (photoSize / 2);
      const centerY = borderWidth + (photoSize * 0.45);
      const radius = photoSize * 0.65;

      const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
      grad.addColorStop(0.55, 'rgba(255, 255, 255, 0.1)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0.15)');

      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = grad;
      ctx.fillRect(borderWidth, borderWidth, photoSize, photoSize);
      ctx.restore();

      // [핵심 2] 폴라로이드 하단 중앙에 NUBI PHOTO 문구 각인
      ctx.fillStyle = '#222222';
      ctx.font = '500 28px "Courier New", Courier, monospace, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // 하단 여백의 정확한 중앙 좌표에 인쇄
      const textY = borderWidth + photoSize + (bottomBorderWidth / 2) - 5;
      ctx.fillText('NUBI PHOTO', canvasWidth / 2, textY);

      // 결과 출력
      const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
      resultImage.src = dataUrl;
      downloadLink.href = dataUrl;
      resultModal.style.display = 'flex';
    });

    btnClose.addEventListener('click', () => {
      resultModal.style.display = 'none';
    });

    startCamera();
  </script>
</body>
</html>
